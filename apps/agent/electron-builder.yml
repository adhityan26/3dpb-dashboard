appId: com.slizebiz.agent
productName: Slizebiz Agent
directories:
  output: release
win:
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  artifactName: ${productName}-${version}.${ext}
files:
  - out/**/*
  - package.json
