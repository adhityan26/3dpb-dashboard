appId: com.slizebiz.agent
productName: Slizebiz Agent
# build/icon.png (1024x1024, generated via `pnpm generate-icons` dari src/renderer/public/
# logo.svg) -- electron-builder otomatis derive .icns (mac) / .ico (win) dari satu file ini.
icon: build/icon.png
directories:
  output: release
win:
  target: nsis
  # ${env.COMMIT_HASH} diisi scripts/build-installer.mjs (satu-satunya jalan resmi build
  # installer) -- selama staging versi tak naik tiap rebuild, jadi commit hash bawaan nama
  # file ini yang bedain build satu ke lain (lihat CLAUDE.md soal aturan bump versi).
  artifactName: ${productName}-Setup-${version}-${env.COMMIT_HASH}.${ext}
nsis:
  oneClick: false
  # SENGAJA false (sebelumnya true): kalau user (atau kita sendiri, waktu testing) install ke
  # path yang beda-beda antar run, NSIS gagal cocokkan "versi lama di path X" -> logic
  # auto-uninstall-versi-lama-sebelum-install-baru gak pernah terpicu, file lama nyangkut, dan
  # update berikutnya gagal kecuali folder AppData/Program dihapus manual. Path instalasi tetap
  # (selalu %LOCALAPPDATA%\Programs\Slizebiz Agent) menghilangkan sumber ketidakcocokan itu.
  allowToChangeInstallationDirectory: false
  # Eksplisit (bukan cuma andalkan auto-derive dari appId) -- dokumentasi electron-builder:
  # "Used to identify the application for upgrade and uninstall operations", jangan pernah
  # diganti setelah ini biar update-in-place tetap konsisten ke depannya.
  guid: 04F84627-6088-42AF-9F62-8045052DA997
mac:
  target: dmg
  artifactName: ${productName}-${version}-${env.COMMIT_HASH}.${ext}
files:
  - out/**/*
  - package.json
  # tray-icon.png -- dimuat runtime oleh src/main/tray.ts lewat app.getAppPath(), harus ikut
  # ke-package (di luar out/, karena bukan hasil build Vite -- lihat generate-icons.mjs).
  - resources/**/*
